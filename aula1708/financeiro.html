<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Cotações Financeiras - AwesomeAPI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1 class="mb-3">Consulta de Cotações Financeiras</h1>
        <p class="text-muted">Consumo da AwesomeAPI usando <code>return fetch</code></p>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label for="moeda" class="form-label">Par de Moedas</label>
                        <select id="moeda" class="form-select">
                            <option value="USD-BRL" selected>Dólar Americano / Real Brasileiro (USD-BRL)</option>
                            <option value="EUR-BRL">Euro / Real Brasileiro (EUR-BRL)</option>
                            <option value="BTC-BRL">Bitcoin / Real Brasileiro (BTC-BRL)</option>
                            <option value="GBP-BRL">Libra Esterlina / Real Brasileiro (GBP-BRL)</option>
                            <option value="CAD-BRL">Dólar Canadense / Real Brasileiro (CAD-BRL)</option>
                            <option value="ARS-BRL">Peso Argentino / Real Brasileiro (ARS-BRL)</option>
                            <option value="CHF-BRL">Franco Suíço / Real Brasileiro (CHF-BRL)</option>
                            <option value="JPY-BRL">Iene Japonês / Real Brasileiro (JPY-BRL)</option>
                            <option value="CNY-BRL">Yuan Chinês / Real Brasileiro (CNY-BRL)</option>
                            <option value="ETH-BRL">Ethereum / Real Brasileiro (ETH-BRL)</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="numeroDias" class="form-label">Quantidade de Dias</label>
                        <input type="number" id="numeroDias" class="form-control" value="15" min="1" max="360">
                    </div>

                    <div class="col-md-3">
                        <button id="btnBuscar" class="btn btn-primary w-100">Consultar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Spinner de carregamento -->
        <div id="spinner" class="text-center my-4 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>

        <!-- Alerta de Erro -->
        <div id="alertErro" class="alert alert-danger d-none" role="alert"></div>

        <!-- Container de Resultados -->
        <div id="containerResultado" class="d-none">
            <h3 id="infoTitulo" class="h4 mb-3"></h3>
            
            <table class="table table-striped table-bordered" id="tabelaCotacoes">
                <thead class="table-dark">
                    <tr>
                        <th>Data / Hora</th>
                        <th>Compra (Bid)</th>
                        <th>Venda (Ask)</th>
                        <th>Máxima</th>
                        <th>Mínima</th>
                        <th>Variação</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas inseridas pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="financas.js"></script>
</body>
</html>
